[project]
name = "troupe"
version = "0.1.0"
description = "Inspect and change a theatre's hand-edited troupe configuration"
requires-python = ">=3.12"
dependencies = [
    "eventsourcing>=9.5.5,<10",
    "jsonschema>=4.23,<5",
    "ruamel.yaml>=0.19.1,<0.20",
]

[project.scripts]
troupe = "troupe.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/troupe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["src", "tests"]
files = ["src", "tests"]
explicit_package_bases = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".kiro", ".claude"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
